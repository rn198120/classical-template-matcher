<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Template Matching Demo</title>
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        h1 {
            text-align: center;
            color: #fff;
        }
        p.subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
        }
        .uploads {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .dropzone {
            border: 2px dashed #555;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            background: #2a2a2a;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .dropzone.hover {
            border-color: #4caf50;
            background: #2e3a2e;
        }
        .dropzone.has-image {
            padding: 10px;
        }
        .dropzone img {
            max-width: 100%;
            max-height: 280px;
            border-radius: 6px;
        }
        .dropzone .label {
            font-size: 14px;
            color: #999;
        }
        button {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) {
            background: #43a047;
        }
        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 10px;
            text-align: center;
        }
        .result img {
            max-width: 100%;
            border-radius: 6px;
        }
        .result-meta {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
        .result-meta strong {
            color: #4caf50;
            font-size: 16px;
        }
        .error {
            color: #f44336;
            background: #2a1a1a;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
        }
        .loading {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Template Matching Demo</h1>
    <p class="subtitle">Drop a main image and a template, then click Match.</p>

    <div class="uploads">
        <div class="dropzone" id="main-zone">
            <div class="label">📷 Drop main image here</div>
            <input type="file" id="main-input" accept="image/*" style="display:none">
        </div>
        <div class="dropzone" id="template-zone">
            <div class="label">🎯 Drop template here</div>
            <input type="file" id="template-input" accept="image/*" style="display:none">
        </div>
    </div>

    <button id="match-btn" disabled>Match</button>

    <div id="result-area"></div>

    <script>
        let mainFile = null;
        let templateFile = null;

        function setupDropzone(zoneId, inputId, onFile) {
            const zone = document.getElementById(zoneId);
            const input = document.getElementById(inputId);

            zone.addEventListener("click", () => input.click());

            zone.addEventListener("dragover", (e) => {
                e.preventDefault();
                zone.classList.add("hover");
            });
            zone.addEventListener("dragleave", () => zone.classList.remove("hover"));
            zone.addEventListener("drop", (e) => {
                e.preventDefault();
                zone.classList.remove("hover");
                if (e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });
            input.addEventListener("change", (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });

            function handleFile(file) {
                onFile(file);
                const reader = new FileReader();
                reader.onload = (e) => {
                    zone.classList.add("has-image");
                    zone.innerHTML = `<img src="${e.target.result}" alt="preview">`;
                };
                reader.readAsDataURL(file);
                updateMatchButton();
            }
        }

        function updateMatchButton() {
            document.getElementById("match-btn").disabled = !(mainFile && templateFile);
        }

        setupDropzone("main-zone", "main-input", (f) => { mainFile = f; });
        setupDropzone("template-zone", "template-input", (f) => { templateFile = f; });

        document.getElementById("match-btn").addEventListener("click", async () => {
            const resultArea = document.getElementById("result-area");
            const btn = document.getElementById("match-btn");

            resultArea.innerHTML = `<div class="result"><div class="loading">Matching… this may take a few seconds.</div></div>`;
            btn.disabled = true;

            const formData = new FormData();
            formData.append("main_image", mainFile);
            formData.append("template_image", templateFile);

            try {
                const response = await fetch("/match", {
                    method: "POST",
                    body: formData,
                });
                const data = await response.json();

                if (!response.ok) {
                    resultArea.innerHTML = `<div class="result"><div class="error">Error: ${data.error || "unknown error"}</div></div>`;
                } else {
                    resultArea.innerHTML = `
                        <div class="result">
                            <img src="${data.result_image}" alt="detection result">
                            <div class="result-meta">
                                NCC score: <strong>${data.score.toFixed(4)}</strong>
                                &nbsp;|&nbsp; Detection at: (x=${data.x}, y=${data.y})
                                &nbsp;|&nbsp; Template size: ${data.template_width}×${data.template_height}
                            </div>
                        </div>
                    `;
                }
            } catch (err) {
                resultArea.innerHTML = `<div class="result"><div class="error">Network error: ${err.message}</div></div>`;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
